<body class="bg-[#050505] text-white pt-32">

            <h2 class="font-serif text-4xl mb-12 italic text-center">Ihre Zeit bei uns.</h2>
            <form class="space-y-10">
                <div class="grid md:grid-cols-2 gap-10">
                    <div class="border-b border-white/20 pb-2">
                        <label class="text-[10px] uppercase tracking-widest text-white/40">Stylist</label>
                        <select class="w-full bg-transparent outline-none py-2 text-lg">
                            <option>Arkadius C. Wilhelm</option>
                            <option>Jens Reineccius</option>
                            <option>Gilberto S. Payan</option>
                        </select>
                    </div>
                    <div class="border-b border-white/20 pb-2">
                        <label class="text-[10px] uppercase tracking-widest text-white/40">Datum</label>
                        <input type="date" class="w-full bg-transparent outline-none py-2 text-lg text-white">
                    </div>
                </div>
             
                <button class="w-full bg-[#e30613] py-6 uppercase tracking-[0.4em] text-[11px] font-bold hover:bg-white hover:text-black transition-all">Anfrage Senden</button>
            </form>
        </div>
