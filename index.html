<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT'S IN | MEISTERFRISEURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --luxury-red: #e30613; }
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; scroll-behavior: smooth; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .hero-bg { 
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1562322140-8baeececf3df?q=80&w=2069&auto=format&fit=crop');
            background-size: cover; background-position: center; height: 100vh;
        }
        #mobile-menu { transition: transform 0.5s cubic-bezier(0.77, 0.2, 0.05, 1.0); transform: translateX(100%); }
        #mobile-menu.active { transform: translateX(0); }
    </style>
</head>
<body>
    <nav class="fixed w-full z-[100] flex justify-between items-center px-6 md:px-20 py-8 bg-black/60 backdrop-blur-md">
        <div class="text-2xl font-light tracking-[0.4em]"><a href="index.html">IT'S <span class="text-[#e30613] font-bold">IN</span></a></div>
        <div class="hidden md:flex space-x-12 uppercase text-[10px] tracking-[0.3em]">
            <a href="leistungen.html" class="hover:text-[#e30613]">Leistungen</a>
            <a href="team.html" class="hover:text-[#e30613]">Team</a>
            <a href="kontakt.html" class="hover:text-[#e30613]">Kontakt</a>
            <a href="booking.html" class="text-[#e30613]">Booking</a>
        </div>
        <button class="md:hidden flex flex-col space-y-1.5 z-[110]" onclick="document.getElementById('mobile-menu').classList.toggle('active')">
            <div class="w-6 h-[1px] bg-white"></div><div class="w-6 h-[1px] bg-[#e30613]"></div><div class="w-6 h-[1px] bg-white"></div>
        </button>
    </nav>

    <div id="mobile-menu" class="fixed inset-0 bg-[#050505] z-[105] flex flex-col items-center justify-center space-y-10 text-2xl font-serif italic">
        <a href="index.html" class="text-[#e30613]">Home</a>
        <a href="leistungen.html">Leistungen</a>
        <a href="team.html">Team</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="booking.html" class="text-[#e30613]">Booking</a>
        <button onclick="document.getElementById('mobile-menu').classList.remove('active')" class="mt-10 text-xs uppercase tracking-widest border border-white/20 px-8 py-3">Schließen</button>
    </div>

    <header class="hero-bg flex items-center justify-center text-center">
        <div class="max-w-5xl px-6">
            <h1 class="text-6xl md:text-[9rem] font-serif italic font-light mb-8 leading-none">Mastery.</h1>
            <p class="text-[10px] uppercase tracking-[0.8em] mb-12 text-white/40">Wolfsburgs erste Adresse für Exzellenz</p>
            <div class="h-24 w-[1px] bg-[#e30613] mx-auto animate-bounce"></div>
        </div>
    </header>

    <section class="py-40 px-10 border-t border-white/5 text-center">
        <h2 class="text-4xl md:text-6xl font-serif italic mb-10">Schnitt & Präzision</h2>
        <p class="max-w-2xl mx-auto text-white/40 font-light leading-relaxed mb-10">Erfahren Sie mehr über unsere Philosophie des Handwerks und unsere exklusiven Services.</p>
        <a href="leistungen.html" class="text-[10px] uppercase tracking-[0.4em] border-b border-[#e30613] pb-2">Entdecken</a>
    </section>
</body>
</html>
